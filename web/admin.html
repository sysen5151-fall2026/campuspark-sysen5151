<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CampusPark Staff</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="staff">

<header class="nav">
  <a class="brand" href="/">CampusPark</a>
  <nav><a href="/">Driver view</a></nav>
</header>

<main class="staff-wrap">
  <h1>Parking controls.</h1>
  <p class="lede">What every search and booking is checked against right now. <span class="version" id="version"></span></p>

  <div class="staff-grid">
    <section class="card">
      <h2>In force</h2>
      <table class="pools">
        <thead><tr><th>Pool</th><th>Permits</th><th>Places</th><th>Closed today</th></tr></thead>
        <tbody id="pools"></tbody>
      </table>
    </section>

    <section class="card">
      <h2>Change a pool</h2>
      <form id="change" class="fields">
        <label><span>Staff account (demo: admin01)</span><input id="account" value="admin01" autocomplete="off" required></label>
        <label><span>Pool</span><select id="pool"></select></label>
        <label><span>New number of places</span><input id="capacity" type="number" min="0" placeholder="Keep as is"></label>
        <div class="row" style="grid-template-columns: 1fr 1fr">
          <label><span>Closed from</span><input id="close-start" type="time"></label>
          <label><span>Until</span><input id="close-end" type="time"></label>
        </div>
        <label class="check"><input id="clear" type="checkbox"> Reopen it first (remove today's closures)</label>
        <button class="pill wide" type="submit">Apply the change</button>
      </form>
      <div class="outcome" id="result" aria-live="polite"></div>
    </section>
  </div>
</main>

<script src="/static/admin.js"></script>
</body>
</html>
